server:
  port: ${LAVALINK_PORT:25594}
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    # Define this in the Lavalink Pterodactyl environment and use the identical
    # LAVALINK_PASSWORD in the Discord bot environment.
    password: "${LAVALINK_PASSWORD}"

    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 8
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 5
    gc-warnings: true
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # Clients are queried in order. MUSIC handles YouTube Music (and ytmsearch),
    clients:
      - TVHTML5EMBEDDED
      - WEB
      - WEBEMBEDDED
      - IOS
      - ANDROID
      - MUSIC

    clientOptions:
      TVHTML5EMBEDDED:
        searching: false
        playback: true
      MUSIC:
        searching: true
        playback: false

    # Proof of Origin (poToken) for WEB client to bypass bot checks & SABR without formats.
    # Can be generated using tools like youtube-trusted-session-generator.
    pot:
      token: "${YOUTUBE_PO_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"

    oauth:
      # Keep OAuth off to prevent 400 invalid_grant polling loops when no device code is entered.
      # TVHTML5EMBEDDED and WEB already provide unthrottled streaming without OAuth.
      enabled: false
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"

    remoteCipher:
      url: "https://cipher.kikkia.dev/"

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: WARN
  request:
    # Payloads include Discord voice-session material; never log them.
    enabled: false
    includeClientInfo: false
    includeHeaders: false
    includePayload: false
    includeQueryString: false
