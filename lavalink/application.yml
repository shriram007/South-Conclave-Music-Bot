server:
  port: ${LAVALINK_PORT:25594}
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    # Define this in the Lavalink Pterodactyl environment and use the identical
    # LAVALINK_PASSWORD in the Discord bot environment.
    password: "${LAVALINK_PASSWORD}"

    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 100
    playerUpdateInterval: 5
    gc-warnings: true
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # MUSIC handles ytmsearch only. Prefer the current non-Web playback clients;
    # TV remains the OAuth fallback, while WEB clients are last-resort fallbacks.
    clients:
      - MUSIC
      - ANDROID
      - ANDROID_MUSIC
      - ANDROID_VR
      - TVHTML5_SIMPLY
      - TV
      - MWEB
      - WEB
      - WEBEMBEDDED
      - IOS

    clientOptions:
      MUSIC:
        playback: false
      TV:
        searching: false
        playlistLoading: false

    oauth:
      enabled: true
      # Store a new disposable-account token in the Lavalink server environment.
      # A valid refresh token skips initialization automatically.
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"

    remoteCipher:
      url: "https://cipher.kikkia.dev/"

logging:
  file:
    path: ./logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    # Payloads include Discord voice-session material; never log them.
    enabled: false
    includeClientInfo: false
    includeHeaders: false
    includePayload: false
    includeQueryString: false
